<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>AR Experience</title>

  <!-- MindAR + A-Frame -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"></script>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: sans-serif; }

    #overlay {
      position: fixed; inset: 0; z-index: 100;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #0f0c29; color: white; gap: 16px;
      padding: 20px; text-align: center;
    }
    #overlay h2 { font-size: 1.3rem; }
    #overlay p  { opacity: 0.6; font-size: 0.9rem; max-width: 300px; line-height: 1.5; }

    .spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #hint {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.6); color: white;
      padding: 10px 20px; border-radius: 20px;
      font-size: 0.9rem; z-index: 50;
      display: none;
    }
  </style>
</head>
<body>

  <div id="overlay">
    <div class="spinner"></div>
    <h2 id="overlay-title">Loading AR Experience</h2>
    <p id="overlay-msg">Fetching project data...</p>
  </div>

  <div id="hint">Point camera at the target image</div>

  <script>
    // Empty string = relative URL (/api/...)
    // Works via Vite proxy in dev, and Vercel rewrites in production
    const API_BASE = '';

    function setMsg(title, msg) {
      document.getElementById('overlay-title').textContent = title;
      document.getElementById('overlay-msg').textContent = msg;
    }

    function showError(msg) {
      document.querySelector('.spinner').style.display = 'none';
      setMsg('Something went wrong', msg);
    }

    async function init() {
      // Extract slug from /ar.html?slug=... or path /ar/SLUG
      const params = new URLSearchParams(window.location.search);
      let slug = params.get('slug');
      if (!slug) {
        const parts = window.location.pathname.split('/');
        slug = parts[parts.length - 1];
      }
      if (!slug) { showError('No project specified in URL.'); return; }

      // 1. Fetch project data
      let project;
      try {
        const res = await fetch(`${API_BASE}/api/ar/${slug}`);
        if (!res.ok) throw new Error();
        project = await res.json();
        document.title = project.title + ' – AR';
        setMsg(project.title, 'Processing target image...');
      } catch {
        showError('Could not load project. Check your connection.');
        return;
      }

      // 2. Count the view (best-effort, don't await)
      fetch(`${API_BASE}/api/ar/${slug}/view`, { method: 'POST' }).catch(() => {});

      // 3. Compile target image → .mind file (runs in browser)
      let mindUrl;
      try {
        mindUrl = await compileMind(project.targetImageUrl);
      } catch (e) {
        console.error(e);
        showError('Failed to process target image. The image may not be suitable for AR tracking.');
        return;
      }

      // 4. Build A-Frame AR scene dynamically
      setMsg(project.title, 'Starting camera...');
      buildScene(mindUrl, project.overlayVideoUrl);
    }

    async function compileMind(imageUrl) {
      const compiler = new MINDAR.IMAGE.Compiler();
      const img = await loadImage(imageUrl);
      await compiler.compileImageTargets([img], (progress) => {
        setMsg(
          document.getElementById('overlay-title').textContent,
          `Processing image: ${Math.round(progress * 100)}%`
        );
      });
      const buffer = await compiler.exportData();
      return URL.createObjectURL(new Blob([buffer]));
    }

    function loadImage(url) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error('Image load failed: ' + url));
        img.src = url;
      });
    }

    function buildScene(mindUrl, videoUrl) {
      const scene = document.createElement('a-scene');
      scene.setAttribute('mindar-image', `imageTargetSrc: ${mindUrl}; autoStart: true`);
      scene.setAttribute('color-space', 'sRGB');
      scene.setAttribute('renderer', 'colorManagement: true, physicallyCorrectLights');
      scene.setAttribute('vr-mode-ui', 'enabled: false');
      scene.setAttribute('device-orientation-permission-ui', 'enabled: false');

      scene.innerHTML = `
        <a-assets>
          <video id="ar-video"
            src="${videoUrl}"
            preload="auto" loop playsinline webkit-playsinline
            crossorigin="anonymous">
          </video>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0">
          <a-plane
            src="#ar-video"
            position="0 0 0.001"
            width="1" height="0.552"
            material="opacity: 1; side: double">
          </a-plane>
        </a-entity>
      `;

      document.body.appendChild(scene);

      // Hide overlay when AR is ready
      scene.addEventListener('arReady', () => {
        document.getElementById('overlay').style.display = 'none';
        document.getElementById('hint').style.display = 'block';
      });

      // Play/pause video with target detection
      const target = scene.querySelector('[mindar-image-target]');
      const getVideo = () => document.getElementById('ar-video');

      target.addEventListener('targetFound', () => {
        document.getElementById('hint').style.display = 'none';
        getVideo()?.play();
      });
      target.addEventListener('targetLost', () => {
        document.getElementById('hint').style.display = 'block';
        getVideo()?.pause();
      });
    }

    init().catch((err) => {
      console.error(err);
      showError('Unexpected error. Try refreshing the page.');
    });
  </script>
</body>
</html>
